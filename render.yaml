services:
  - type: web
    name: veripaper-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    plan: free
    disk:
      name: veripaper-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PROJECT_NAME
        value: VeriPaper API
      - key: APP_VERSION
        value: 1.0.0
      - key: DB_ENGINE
        value: sqlite
      - key: DB_PATH
        value: /app/data/veripaper.sqlite
      - key: AI_MODEL_PATH
        value: /app/models/ai_detector.joblib
      - key: TRANSFORMER_MODEL_DIR
        value: /app/models/ai_detector_transformer
      - key: REPORTS_DIR
        value: /app/reports
      - key: MAX_UPLOAD_SIZE_MB
        value: 15
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health

  - type: web
    name: veripaper-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://veripaper-api.onrender.com/api
