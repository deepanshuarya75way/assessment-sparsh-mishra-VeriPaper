name: CI

on:
  push:
    branches: ["main", "master", "feature/**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Git LFS (model weights are tracked with LFS)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq git-lfs && git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # Use the production (torch-free) dependency set: it is what actually
          # ships in the Docker image and is all the CI tests need. Installing
          # the root requirements.txt would pull torch (~2.4 GB of CUDA wheels)
          # and exhaust the runner's disk (Errno 28: No space left on device).
          pip install -r ../backend/requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install embedded frontend dependencies (Render builds here)
        run: npm ci
        working-directory: backend/frontend

      - name: Build embedded frontend (production asset base)
        run: npm run build:prod
        working-directory: backend/frontend

  deployment-verification:
    # Live smoke test against the deployed environment. "staging" is the
    # render preview/staging slot (if present) and falls back to production
    # so every push verifies the actually reachable deployment surfaces:
    # health, model engine, frontend, and all five analysis modules.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && needs.backend-tests.result == 'success')
    needs: [backend-tests, frontend-build]
    steps:
      - name: Set deployment targets
        run: |
          echo "STAGING_URL=${{ vars.STAGING_URL || 'https://veripaper.onrender.com' }}" >> "$GITHUB_ENV"
          echo "PRODUCTION_URL=https://veripaper.onrender.com" >> "$GITHUB_ENV"

      - name: Health check (production)
        run: |
          curl -sf --max-time 30 "${{ env.PRODUCTION_URL }}/health" || exit 1
          curl -sf --max-time 30 "${{ env.STAGING_URL }}/health" || exit 1

      - name: Transformer engine status (production)
        run: |
          # Render free tier sleeps the service; a fresh boot may defer the
          # transformer weights restore to the first request. Probe a few
          # times with gaps so a cold-start race does not fail the check.
          ATTEMPTS=5
          INTERVAL=30
          for i in $(seq 1 $ATTEMPTS); do
            body=$(curl -sf --max-time 120 "${{ env.PRODUCTION_URL }}/api/detector/status" || true)
            echo "$body"
            if [ -n "$body" ] && echo "$body" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d.get('load_ok') is True, 'transformer not loaded'
          assert d.get('transformer_load_error') is None, d.get('transformer_load_error')
          print('transformer engine OK, test score =', d.get('test_inference_score'))
          "; then
              echo "Transformer engine healthy on attempt $i/$ATTEMPTS"
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS: transformer not ready yet; warming up the service..."
            curl -s --max-time 120 -o /dev/null "${{ env.PRODUCTION_URL }}/api/detector/config"
            sleep $INTERVAL
          done
          echo "Transformer engine did not become healthy after $ATTEMPTS attempts"
          exit 1

      - name: Frontend serves the dashboard
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ env.PRODUCTION_URL }}/static/")
          [ "$code" = "200" ] || [ "$code" = "304" ] || exit 1

      - name: Staging parity check
        run: |
          for endpoint in /health /api/detector/config; do
            diff <(curl -s --max-time 30 "${{ env.PRODUCTION_URL }}$endpoint" | python3 -c "import json,sys;print(sorted(json.load(sys.stdin).keys()))" 2>/dev/null) \
                 <(curl -s --max-time 30 "${{ env.STAGING_URL }}$endpoint" | python3 -c "import json,sys;print(sorted(json.load(sys.stdin).keys()))" 2>/dev/null) \
              && echo "$endpoint: staging matches production" || exit 1
          done

      - name: Module availability (all 5 verification modules)
        run: |
          curl -sf --max-time 60 "${{ env.PRODUCTION_URL }}/api/detector/env" && echo " => all modules reachable"
