name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Install Git LFS (model weights are tracked with LFS)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq git-lfs && git lfs install

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (production asset base)
        run: npm run build:prod
        working-directory: frontend

      - name: Install embedded frontend dependencies (Render builds here)
        run: npm ci
        working-directory: backend/frontend

      - name: Build embedded frontend (production asset base)
        run: npm run build:prod
        working-directory: backend/frontend
